  power_uw:
    name: "Power"
    unit: "µW"
    format: ".1f"
    degradation_key: "power_percent"
  ugbw_mhz:
    name: "UGBW"
    unit: "MHz"
    format: ".1f"
    degradation_key: "ugbw_percent"
  area:
    name: "Area"
    unit: "µm²"
    format: ".1f"
    degradation_key: "area_percent"
  fom:
    name: "FOM"
    unit: ""
    format: ".3f"
    degradation_key: "fom_percent"

metric_post:
  dc_gain_db:
    scale: 1
    decimals: 2
    unit: "dB"
  ugbw:
    scale: 1e-3
    decimals: 2
    unit: "kHz"
  power_dc:
    scale: 1e6
    decimals: 2
    unit: "µW"
  fom:
    expr: "dc_gain_db * ugbw / power_dc"
    scale: 1
    decimals: 3
    unit: ""

ota_subckt_template: |
  .subckt IAC GNDA VDDA VINN VINP VOUT
  * PMOS BIAS CURRENT MIRROR - Cascoded structure
  xm65 VB2 VB2 VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m65} w={W_m65} m={m_m65}
  xm0 NET2 VB1 VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m0} w={W_m0} m={m_m0}
  xm57 VB1 VB2 NET2 VDDA sky130_fd_pr__pfet_01v8 l={L_m57} w={W_m57} m={m_m57}
  xm1 NET3 VB1 VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m1} w={W_m1} m={m_m1}
  xm58 VB4 VB2 NET3 VDDA sky130_fd_pr__pfet_01v8 l={L_m58} w={W_m58} m={m_m58}
  xm3 NET8 VB1 VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m3} w={W_m3} m={m_m3}
  xm62 VB3 VB2 NET8 VDDA sky130_fd_pr__pfet_01v8 l={L_m62} w={W_m62} m={m_m62}
  xm2 NET6 VB1 VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m2} w={W_m2} m={m_m2}
  xm61 NET7 VB2 NET6 VDDA sky130_fd_pr__pfet_01v8 l={L_m61} w={W_m61} m={m_m61}
  xm4 TAIL VB1 VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m4} w={W_m4} m={m_m4}
  xm5 VOUTN VOUTN VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m5} w={W_m5} m={m_m5}
  xm6 VOUTP VOUTN VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m6} w={W_m6} m={m_m6}
  xm7 NET049 VB1 VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m7} w={W_m7} m={m_m7}
  xm66 NET10 VB2 NET049 VDDA sky130_fd_pr__pfet_01v8 l={L_m66} w={W_m66} m={m_m66}
  * FIRST STAGE - PMOS Differential Pair with NMOS Folded Cascode
  xm8 DM_2 VINN TAIL TAIL sky130_fd_pr__pfet_01v8 l={L_m8} w={W_m8} m={m_m8}
  xm9 NET063 VINP TAIL TAIL sky130_fd_pr__pfet_01v8 l={L_m9} w={W_m9} m={m_m9}
  xm19 DM_2 VB4 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m19} w={W_m19} m={m_m19}
  xm20 NET063 VB4 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m20} w={W_m20} m={m_m20}
  xm15 VOUTN VB3 DM_2 GNDA sky130_fd_pr__nfet_01v8 l={L_m15} w={W_m15} m={m_m15}
  xm16 VOUTP VB3 NET063 GNDA sky130_fd_pr__nfet_01v8 l={L_m16} w={W_m16} m={m_m16}
  * NMOS BIAS GENERATION
  xm14 VB3 VB3 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m14} w={W_m14} m={m_m14}
  xm17 NET54 VB4 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m17} w={W_m17} m={m_m17}
  xm12 VB4 VB3 NET54 GNDA sky130_fd_pr__nfet_01v8 l={L_m12} w={W_m12} m={m_m12}
  xm18 NET56 VB4 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m18} w={W_m18} m={m_m18}
  xm13 NET7 VB3 NET56 GNDA sky130_fd_pr__nfet_01v8 l={L_m13} w={W_m13} m={m_m13}
  xm64 NET9 VB4 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m64} w={W_m64} m={m_m64}
  xm63 VB2 VB3 NET9 GNDA sky130_fd_pr__nfet_01v8 l={L_m63} w={W_m63} m={m_m63}
  * SECOND STAGE
  xm10 NET043 VOUTP VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m10} w={W_m10} m={m_m10}
  xm70 NET1 NET043 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m70} w={W_m70} m={m_m70}
  xm69 NET10 NET043 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m69} w={W_m69} m={m_m69}
  xm67 NET043 VB3 NET1 GNDA sky130_fd_pr__nfet_01v8 l={L_m67} w={W_m67} m={m_m67}
  xm68 NET1 VB4 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m68} w={W_m68} m={m_m68}
  * OUTPUT STAGE
  xm23 VOUT NET10 GNDA GNDA sky130_fd_pr__nfet_01v8 l={L_m23} w={W_m23} m={m_m23}
  xm11 VOUT VOUTP VDDA VDDA sky130_fd_pr__pfet_01v8 l={L_m11} w={W_m11} m={m_m11}
  * COMPENSATION (Indirect Amplifier)
  C0 VOUTP VOUT {CM1}
  C1 NET10 NET4 {CM2}
  R0 NET4 GNDA {RM}
  * BIAS CURRENT SOURCE
  I0 VB1 GNDA {IBIAS}
  .ends IAC

testbench_template: |
  * IAC Amplifier Testbench (Indirect Amplifier Compensation) - High Dimensional
  .lib {pdk_lib_path} tt

  {ota_subckt}

  VDD VDD 0 DC {vdd}
  VSS VSS 0 DC 0
  VINP VINP 0 DC {vcm} AC 0.5
  VINN VINN 0 DC {vcm} AC -0.5

  XDUT VSS VDD VINN VINP VOUT {subckt_name}

  CLOAD VOUT 0 {CLOAD}
  RLOAD VOUT 0 {RLOAD}

  .control
  op
  let vdd_current = abs(i(VDD))
  let power_dc = vdd_current * {vdd}
  print power_dc

  ac dec 100 1 10g
  let gain_db = vdb(VOUT)
  let dc_gain_db = gain_db[0]
  print dc_gain_db

  if dc_gain_db > 0
    meas ac ugbw WHEN gain_db=0 CROSS=1
  end
  quit
  .endc
  .end